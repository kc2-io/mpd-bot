[package]
name = "mpd-bot"
version = "0.1.0"
edition = "2024"
description = "A small, local AI companion for stream chat"

[dependencies]
mpd-bot-view = { path = "desktop-view" }
slint = { version = "=1.17.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "unstable-winit-030", "system-tray", "accessibility", "log"] }
log = "0.4"
png = "0.18"
fs2 = "0.4"
fastrand = "2"
webbrowser = "1"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
tokio = { version = "1", features = ["rt", "macros", "net", "signal", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
tempfile = "3"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[build-dependencies]
semver = "1"

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
